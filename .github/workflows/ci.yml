name: Flutter desktop

on:
  push:
    branches: [main, master, work]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libsqlite3-dev xvfb
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter build ${{ matrix.target }} --release
      - name: Make bundled SQLite available to Windows unit tests
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/build/windows/x64/runner/Release" >> "$GITHUB_PATH"
      - run: flutter test --reporter expanded
      - name: Native clipboard smoke test on X11
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test/clipboard_smoke_test.dart -d linux
      - uses: actions/upload-artifact@v4
        with:
          name: clipshelf-${{ matrix.target }}
          path: |
            build/linux/x64/release/bundle/
            build/macos/Build/Products/Release/*.app
            build/windows/x64/runner/Release/
