name: clipshelf
description: A cross-platform desktop clipboard shelf built with Flutter.
publish_to: none
version: 0.2.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  file_selector: ^1.0.3
  flutter_highlight: ^0.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.41
  super_clipboard: ^0.9.1
  tray_manager: 0.5.2
  uuid: ^4.5.1
  window_manager: ^0.5.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon.ico
